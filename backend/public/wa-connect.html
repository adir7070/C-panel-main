<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>חיבור WhatsApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      direction: rtl;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .wa-icon {
      width: 64px;
      height: 64px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .wa-icon svg { width: 36px; height: 36px; fill: #fff; }
    h1 { font-size: 22px; color: #1E1E1E; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    #qr-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 264px;
    }
    #qr-container img {
      width: 264px;
      height: 264px;
      border-radius: 8px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-text {
      margin-top: 16px;
      font-size: 15px;
      color: #888;
      min-height: 24px;
    }
    .connected-box {
      background: #E8F5E9;
      border-radius: 12px;
      padding: 24px;
    }
    .connected-box .check {
      width: 56px; height: 56px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      color: #fff;
    }
    .connected-box h2 { font-size: 20px; color: #2E7D32; margin-bottom: 4px; }
    .connected-box p { font-size: 14px; color: #4CAF50; }
    .error-box {
      background: #FFEBEE;
      border-radius: 12px;
      padding: 24px;
      color: #C62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wa-icon">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </div>
    <h1>חיבור WhatsApp</h1>
    <p class="subtitle">סרקו את הקוד עם אפליקציית WhatsApp שלכם</p>
    <div id="qr-container">
      <div class="spinner"></div>
    </div>
    <div id="status-text">מתחבר...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const sessionId = window.location.pathname.split('/').pop();
    const statusEl = document.getElementById('status-text');
    const qrContainer = document.getElementById('qr-container');

    const socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      socket.emit('join', `session:${sessionId}`);
      statusEl.textContent = 'ממתין לקוד QR...';
    });

    socket.on('qr', (data) => {
      qrContainer.innerHTML = `<img src="${data.qr}" alt="QR Code" />`;
      statusEl.textContent = 'סרקו את הקוד כעת';
    });

    socket.on('status', (data) => {
      if (data.status === 'connected') {
        const phone = data.phone || '';
        qrContainer.innerHTML = `
          <div class="connected-box">
            <div class="check">&#10003;</div>
            <h2>מחובר בהצלחה!</h2>
            <p>${phone ? '+' + phone : ''}</p>
          </div>`;
        statusEl.textContent = '';

        // Notify React Native WebView
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'wa_status',
            status: 'connected',
            phone: phone,
          }));
        }
      } else if (data.status === 'disconnected') {
        qrContainer.innerHTML = `
          <div class="error-box">
            <p>החיבור נותק. נסו שנית.</p>
          </div>`;
        statusEl.textContent = '';

        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'wa_status',
            status: 'disconnected',
          }));
        }
      }
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'אבד חיבור לשרת...';
    });

    socket.on('connect_error', () => {
      statusEl.textContent = 'שגיאת חיבור לשרת';
    });
  </script>
</body>
</html>
