<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שינוי אמצעי תשלום - פייסבוק</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 36px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo { font-size: 40px; margin-bottom: 16px; }
        h2 { color: #1c1e21; font-size: 20px; margin-bottom: 10px; }
        .sub { color: #606770; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        .account-id {
            display: inline-block;
            background: #f0f2f5;
            color: #444;
            font-size: 12px;
            font-family: monospace;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 24px;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1877f2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover:not(:disabled) { background: #166fe5; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
        .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.visible { display: block; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">💳</div>
    <h2>שינוי אמצעי תשלום</h2>
    <p class="sub">הזנת פרטי הכרטיס תתבצע ישירות בחלון המאובטח של פייסבוק. הפרטים לא עוברים דרך השרת שלנו.</p>
    <div class="account-id" id="acct-label">טוען...</div>
    <button id="btn" onclick="startFlow()">פתח חלון תשלום פייסבוק</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    // Read account_id from URL: /facebook-payment?account_id=41652171804751
    const params    = new URLSearchParams(window.location.search);
    const accountId = params.get('account_id') || '';

    document.getElementById('acct-label').textContent =
        accountId ? 'Ad Account: ' + accountId : '⚠️ חסר account_id בכתובת URL';

    window.fbAsyncInit = function () {
        FB.init({
            appId  : '1468993904253047',
            cookie : true,
            xfbml  : false,
            version: 'v19.0'
        });
    };

    (function (d, s, id) {
        if (d.getElementById(id)) return;
        var js = d.createElement(s);
        js.id = id;
        js.src = 'https://connect.facebook.net/en_US/sdk.js';
        d.getElementsByTagName(s)[0].parentNode.insertBefore(js, d.getElementsByTagName(s)[0]);
    }(document, 'script', 'facebook-jssdk'));

    function showMsg(html, isError) {
        var el = document.getElementById('msg');
        el.innerHTML = html;
        el.className = 'msg visible ' + (isError ? 'error' : 'success');
    }

    function startFlow() {
        if (!accountId) {
            showMsg('⚠️ שגיאה: לא נמצא account_id בכתובת ה-URL. יש לפתוח דף זה עם ?account_id=XXXXXXX', true);
            return;
        }

        var btn = document.getElementById('btn');
        btn.textContent = 'מתחבר לפייסבוק...';
        btn.disabled = true;

        FB.login(function (resp) {
            if (!resp.authResponse) {
                btn.textContent = 'פתח חלון תשלום פייסבוק';
                btn.disabled = false;
                showMsg('⚠️ יש לאשר את ההתחברות לפייסבוק כדי להמשיך.', true);
                return;
            }

            btn.textContent = 'פותח חלון תשלום...';

            FB.ui({
                method    : 'ads_payment',
                account_id: accountId,
                display   : 'popup'
            }, function (paymentResp) {
                btn.textContent = 'פתח חלון תשלום פייסבוק';
                btn.disabled = false;

                if (paymentResp && !paymentResp.error_message) {
                    showMsg('<strong>הכרטיס עודכן בהצלחה ✓</strong><br>אמצעי התשלום שויך לחשבון המודעות.', false);
                    // Notify parent CPanel window if opened as popup
                    if (window.opener) {
                        window.opener.postMessage({ type: 'fb_payment_result', status: 'success' }, '*');
                    }
                } else {
                    var errMsg = (paymentResp && paymentResp.error_message) || 'הפעולה בוטלה על ידי המשתמש.';
                    showMsg('<strong>שגיאה:</strong><br>' + errMsg, true);
                    if (window.opener) {
                        window.opener.postMessage({ type: 'fb_payment_result', status: 'error', message: errMsg }, '*');
                    }
                }
            });

        }, { scope: 'ads_management' });
    }
</script>
</body>
</html>
