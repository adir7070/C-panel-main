<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iconiq — API Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --indigo: #818cf8;
      --purple: #c084fc;
      --green: #22c55e;
      --green-light: #86efac;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --muted: rgba(255,255,255,0.3);
      --subtle: rgba(255,255,255,0.12); 
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080810;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
    }

    /* Top glow */
    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(99,102,241,0.12) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 64px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 32px 80px rgba(0,0,0,0.5);
      max-width: 520px;
      width: 92%;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(129,140,248,0.35);
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .logo-text {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.22);
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 0.88rem;
      color: var(--green-light);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(34,197,94,0.9);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(34,197,94,0.9); }
      50%       { opacity: 0.4; box-shadow: 0 0 3px rgba(34,197,94,0.3); }
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 32px 0;
    }

    /* ── Stats row ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 0;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
    }

    .stat + .stat {
      border-left: 1px solid rgba(255,255,255,0.07);
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: -0.3px;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ── Footer meta ── */
    .divider-sm {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 28px 0 20px;
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 0.76rem;
      color: rgba(255,255,255,0.22);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .meta-item svg {
      width: 12px;
      height: 12px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Outer version pill ── */
    .version-pill {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d0d1a;
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.7rem;
      color: var(--indigo);
      letter-spacing: 1px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="version-pill">v1.0</div>

    <div class="logo-wrap">
      <div class="logo-icon">
        <!-- lightning bolt -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.5 13.5H11L10 22L20 10H13.5L13 2Z"/>
        </svg>
      </div>
      <div class="logo-text">Iconiq</div>
    </div>
    <div class="tagline">API Server</div>

    <div class="status-badge">
      <span class="dot"></span>
      All systems operational
    </div>

    <hr class="divider" />

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="time">--:--:--</span>
        <span class="stat-label">Server Time</span>
      </div>
      <div class="stat">
        <span class="stat-value">Node.js</span>
        <span class="stat-label">Runtime</span>
      </div>
      <div class="stat">
        <span class="stat-value">Express</span>
        <span class="stat-label">Framework</span>
      </div>
    </div>

    <hr class="divider-sm" />

    <div class="meta">
      <span class="meta-item">
        <!-- globe icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        REST API
      </span>
      <span class="meta-item">
        <!-- lock icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Authenticated
      </span>
      <span class="meta-item">
        <!-- server icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2"/>
          <rect x="2" y="14" width="20" height="8" rx="2"/>
          <line x1="6" y1="6" x2="6.01" y2="6"/>
          <line x1="6" y1="18" x2="6.01" y2="18"/>
        </svg>
        Production
      </span>
    </div>
  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      const now = new Date();
      document.getElementById('time').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
