<!doctype html>
<!--
  choose-manager.html — mobile onboarding screen for picking an
  account manager. Designed to be displayed in a WebView from the
  mobile app, but works standalone in a browser too.

  Usage: open with ?phone=<phone> in the query string. The page will:
    1. GET  /api/public/managers
    2. Render cards (avatar, name, bio, ⭐ rating, # clients)
    3. POST /api/public/managers/:id/choose { phone } on tap
    4. Show a success screen + auto-close hook for WebViews

  WebView close hook: when assignment succeeds we call
  window.ReactNativeWebView?.postMessage('manager_chosen:<id>') so the
  RN app can close the modal. Falls back to a "סגור" button if the
  WebView bridge isn't available.
-->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>בחר/י את המנהל שלך</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:        #0F172A;
      --ink-2:      #475569;
      --ink-3:      #94A3B8;
      --paper:      #ffffff;
      --bg:         #F7F8FB;
      --rule:       #E5E7EB;
      --brand:      #4F46E5;
      --brand-2:    #6366F1;
      --gold:       #F59E0B;
      --green:      #10B981;
      --shadow-sm:  0 1px 2px rgba(0,0,0,0.06);
      --shadow-md:  0 8px 24px rgba(15,23,42,0.08);
      --shadow-lg:  0 20px 44px rgba(79,70,229,0.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 20px 8px 24px;
    }
    .eyebrow {
      display: inline-block;
      padding: 4px 12px;
      background: var(--brand);
      color: #fff;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 6px;
      font-size: 24px; font-weight: 800;
      letter-spacing: -0.01em;
    }
    .lead { color: var(--ink-2); font-size: 14px; line-height: 1.55; margin: 0; }

    .grid {
      display: grid; gap: 12px;
      margin-top: 12px;
    }

    /* Manager card */
    .card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .card:active { transform: scale(0.985); }
    .card:hover  { border-color: #D1D5DB; box-shadow: var(--shadow-md); }
    .card[data-selected="true"] {
      border-color: var(--brand);
      box-shadow: var(--shadow-lg);
    }

    .avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: #EEF2FF;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: var(--brand);
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .info { min-width: 0; }
    .name {
      font-size: 16px; font-weight: 800; color: var(--ink);
      margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .meta {
      display: flex; align-items: center; gap: 10px;
      margin-top: 4px;
      font-size: 12px; color: var(--ink-2);
      flex-wrap: wrap;
    }
    .stars { color: var(--gold); font-weight: 700; }
    .stars .empty { color: var(--rule); }
    .count-pill {
      font-size: 11px; color: var(--ink-3); font-weight: 600;
      background: var(--bg); padding: 2px 8px; border-radius: 999px;
    }
    .bio {
      font-size: 12px; color: var(--ink-3); line-height: 1.5;
      margin: 6px 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .arrow {
      color: var(--ink-3);
      flex-shrink: 0;
      transition: transform 0.18s ease, color 0.18s ease;
    }
    .card:hover .arrow { color: var(--brand); transform: translateX(-3px); }

    /* Skeleton */
    .skel {
      background: linear-gradient(90deg, #EEF1F5 25%, #F7F8FB 50%, #EEF1F5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skel-row {
      display: grid; grid-template-columns: 64px 1fr; gap: 14px;
      padding: 14px; background: var(--paper);
      border: 1px solid var(--rule); border-radius: 16px;
      align-items: center;
    }
    .skel-avatar { width: 64px; height: 64px; border-radius: 50%; }
    .skel-line   { height: 12px; border-radius: 6px; }

    /* Error */
    .error {
      padding: 14px 16px; border-radius: 12px;
      background: #FEF2F2; border: 1px solid #FCA5A5;
      color: #B91C1C; font-size: 14px; text-align: center;
    }
    .retry-btn {
      margin-top: 10px;
      background: #B91C1C; color: #fff; border: 0;
      padding: 10px 18px; border-radius: 8px;
      font-weight: 700; font-size: 13px; cursor: pointer;
    }

    /* Success */
    .success {
      text-align: center; padding: 40px 20px;
      background: var(--paper); border-radius: 20px;
      box-shadow: var(--shadow-md);
      margin-top: 24px;
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--green); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 28px rgba(16,185,129,0.35);
      margin-bottom: 16px;
    }
    .success h2 { font-size: 22px; margin: 4px 0 6px; font-weight: 800; }
    .success p  { color: var(--ink-2); margin: 0 0 18px; font-size: 14px; line-height: 1.55; }
    .close-btn {
      background: var(--brand); color: #fff; border: 0;
      padding: 12px 28px; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }

    .empty-state {
      text-align: center; padding: 40px 24px;
      color: var(--ink-3); font-size: 14px;
    }

    /* Submitting overlay */
    .card[data-busy="true"] { opacity: 0.6; pointer-events: none; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--rule);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">ברוכים הבאים</span>
      <h1>בחר/י את המנהל שלך</h1>
      <p class="lead">המנהל שתבחר/י ילווה אותך אישית לאורך כל הדרך — בניית הקמפיינים, בחירת המוצרים והתאמת הפיתרון לעסק שלך.</p>
    </header>

    <div id="content">
      <div class="grid" id="skeleton">
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div>
            <div class="skel skel-line" style="width: 50%;"></div>
            <div class="skel skel-line" style="width: 80%; margin-top: 8px;"></div>
          </div>
        </div>
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div>
            <div class="skel skel-line" style="width: 65%;"></div>
            <div class="skel skel-line" style="width: 75%; margin-top: 8px;"></div>
          </div>
        </div>
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div>
            <div class="skel skel-line" style="width: 55%;"></div>
            <div class="skel skel-line" style="width: 70%; margin-top: 8px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    /* -- Bootstrapping --------------------------------------------- */

    const qs = new URLSearchParams(window.location.search);
    const PHONE = (qs.get("phone") || "").trim();
    /* API base — defaults to same origin which is correct when this
       page is served by the iconiq-server itself. Override via
       ?api=https://api.foo.com if the page is hosted elsewhere. */
    const API = (qs.get("api") || "").trim() || window.location.origin;

    const $content = document.getElementById("content");

    /* -- Helpers --------------------------------------------------- */

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderStars(rating, count) {
      if (!count || rating == null) {
        return '<span style="color: var(--ink-3); font-size: 11px;">אין דירוגים עדיין</span>';
      }
      const full = Math.round(rating);
      let html = '<span class="stars">';
      for (let i = 1; i <= 5; i++) {
        html += i <= full
          ? '<span>★</span>'
          : '<span class="empty">★</span>';
      }
      html += `</span><span style="font-size: 12px; color: var(--ink-2); font-weight: 600;">${rating.toFixed(1)}</span>`;
      html += `<span class="count-pill">${count} ${count === 1 ? "דירוג" : "דירוגים"}</span>`;
      return html;
    }

    function initials(name) {
      const s = (name || "").trim();
      if (!s) return "?";
      return s.charAt(0).toUpperCase();
    }

    function postToWebView(payload) {
      try {
        if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === "function") {
          window.ReactNativeWebView.postMessage(payload);
        }
      } catch (_e) { /* not in a WebView — that's fine */ }
    }

    /* -- Render ---------------------------------------------------- */

    function showError(msg, allowRetry) {
      $content.innerHTML = `
        <div class="error">
          <div>${escapeHtml(msg)}</div>
          ${allowRetry ? `<button class="retry-btn" id="retry">נסה שוב</button>` : ""}
        </div>`;
      if (allowRetry) {
        document.getElementById("retry").addEventListener("click", load);
      }
    }

    function showSuccess(manager) {
      $content.innerHTML = `
        <div class="success">
          <div class="check">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2>${escapeHtml(manager.managerName || manager.name || "המנהל")} בטיפולך :)</h2>
          <p>הכל מוכן. ${escapeHtml(manager.managerName || "המנהל")} יקבל התראה ויחזור אליך בקרוב — נשמע לך טוב?</p>
          <button class="close-btn" id="closeBtn">בואו נתחיל</button>
        </div>`;
      document.getElementById("closeBtn").addEventListener("click", () => {
        postToWebView(`manager_chosen:${manager.managerId || ""}`);
      });
      /* Also auto-notify the WebView immediately so RN can dismiss the
         modal without waiting for the button tap. */
      postToWebView(`manager_chosen:${manager.managerId || ""}`);
    }

    function renderManagers(managers) {
      if (!managers.length) {
        $content.innerHTML = `
          <div class="empty-state">
            כרגע אין מנהלים זמינים — נסה שוב בעוד רגע
          </div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "grid";
      for (const m of managers) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.setAttribute("data-id", m.id);
        card.style.cssText = "all: unset; cursor: pointer;";
        card.innerHTML = `
          <div class="avatar">
            ${m.avatarUrl
              ? `<img src="${escapeHtml(m.avatarUrl)}" alt="" />`
              : escapeHtml(initials(m.name))}
          </div>
          <div class="info">
            <p class="name">${escapeHtml(m.name || "מנהל")}</p>
            <div class="meta">
              ${renderStars(m.rating, m.ratingCount)}
              ${m.clientCount > 0
                ? `<span class="count-pill">${m.clientCount} ${m.clientCount === 1 ? "לקוח" : "לקוחות"}</span>`
                : ""}
            </div>
            ${m.bio ? `<p class="bio">${escapeHtml(m.bio)}</p>` : ""}
          </div>
          <div class="arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>`;
        card.addEventListener("click", () => choose(card, m));
        /* Reapply the "all: unset" loss of base button styles. */
        card.style.display = "grid";
        card.style.gridTemplateColumns = "64px 1fr auto";
        card.style.gap = "14px";
        card.style.alignItems = "center";
        card.style.background = "var(--paper)";
        card.style.border = "1px solid var(--rule)";
        card.style.borderRadius = "16px";
        card.style.padding = "14px";
        card.style.boxShadow = "var(--shadow-sm)";
        card.style.textAlign = "right";
        grid.appendChild(card);
      }
      $content.innerHTML = "";
      $content.appendChild(grid);
    }

    /* -- Actions --------------------------------------------------- */

    async function load() {
      $content.innerHTML = `
        <div class="grid">
          <div class="skel-row"><div class="skel skel-avatar"></div><div><div class="skel skel-line" style="width: 50%;"></div><div class="skel skel-line" style="width: 80%; margin-top: 8px;"></div></div></div>
          <div class="skel-row"><div class="skel skel-avatar"></div><div><div class="skel skel-line" style="width: 65%;"></div><div class="skel skel-line" style="width: 75%; margin-top: 8px;"></div></div></div>
          <div class="skel-row"><div class="skel skel-avatar"></div><div><div class="skel skel-line" style="width: 55%;"></div><div class="skel skel-line" style="width: 70%; margin-top: 8px;"></div></div></div>
        </div>`;
      try {
        const r = await fetch(`${API}/api/public/managers`, {
          headers: { "Accept": "application/json" },
        });
        if (!r.ok) throw new Error(`Server error ${r.status}`);
        const data = await r.json();
        renderManagers(data.managers || []);
      } catch (err) {
        showError(`שגיאה בטעינת המנהלים: ${err.message}`, true);
      }
    }

    async function choose(cardEl, manager) {
      if (!PHONE) {
        showError("חסר מספר טלפון בכתובת — פתח את העמוד מתוך האפליקציה", false);
        return;
      }
      /* Disable all cards while we POST so the user can't double-pick. */
      document.querySelectorAll(".card").forEach(c => c.setAttribute("data-busy", "true"));
      cardEl.setAttribute("data-selected", "true");

      try {
        const r = await fetch(`${API}/api/public/managers/${encodeURIComponent(manager.id)}/choose`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ phone: PHONE }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || j.error || `Server error ${r.status}`);
        showSuccess(j);
      } catch (err) {
        document.querySelectorAll(".card").forEach(c => {
          c.removeAttribute("data-busy");
          c.removeAttribute("data-selected");
        });
        showError(`שגיאה בשיוך המנהל: ${err.message}`, false);
      }
    }

    /* -- Go ------------------------------------------------------- */
    load();
  </script>
</body>
</html>
