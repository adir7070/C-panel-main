<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בדיקת דומיין | Iconiq</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #00a884;
      --primary-hover: #008f6f;
      --bg: #e3e8ec;
      --white: #ffffff;
      --text: #111b21;
      --text-sub: #667781;
      --shadow: 0 4px 24px rgba(0,0,0,0.10);
      --danger: #ef4444;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger-bg: #fee2e2;
      --warn-bg: #fef9c3;
      --warn: #ca8a04;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e3e8ec 0%, #cbd5e1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
    }

    /* ─── Header ─── */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--text);
    }
    .page-header p {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 6px;
    }
    .logo-dot {
      display: inline-block;
      width: 10px; height: 10px;
      background: var(--primary);
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ─── Search Card ─── */
    .search-card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 28px 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 13px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Heebo', sans-serif;
      direction: ltr;
      text-align: left;
      color: var(--text);
      transition: border 0.2s;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .search-input::placeholder {
      color: #b0bec5;
    }

    .search-btn {
      padding: 13px 22px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-btn:hover { background: var(--primary-hover); }
    .search-btn:active { transform: scale(0.97); }
    .search-btn:disabled { background: #b0bec5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Result Card ─── */
    .result-card {
      background: var(--white);
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid #f0f2f5;
    }

    .domain-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .status-badge.available {
      background: var(--success-bg);
      color: var(--success);
    }
    .status-badge.taken {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .status-badge.unknown {
      background: var(--warn-bg);
      color: var(--warn);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ─── Suggestions ─── */
    .suggestions-section {
      padding: 20px 28px;
      border-bottom: 1px solid #f0f2f5;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .suggestions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestion-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      direction: ltr;
    }
    .suggestion-chip:hover {
      background: var(--success-bg);
      border-color: var(--primary);
      color: var(--success);
    }
    .suggestion-chip .chip-icon {
      font-size: 14px;
    }

    /* ─── Whois Summary ─── */
    .whois-section {
      padding: 16px 28px;
      border-bottom: 1px solid #f0f2f5;
    }
    .whois-text {
      font-size: 12px;
      color: var(--text-sub);
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow-y: auto;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.6;
    }

    /* ─── Register Button ─── */
    .register-section {
      padding: 20px 28px;
    }
    .register-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .register-btn:hover { background: var(--primary-hover); }
    .register-btn.coming-soon {
      background: #e2e8f0;
      color: var(--text-sub);
      cursor: not-allowed;
    }

    /* ─── Error ─── */
    .error-msg {
      margin-top: 12px;
      padding: 12px 16px;
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }

    /* ─── JSON Preview (for dev) ─── */
    .json-card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-top: 20px;
      display: none;
      animation: fadeUp 0.3s ease;
    }
    .json-card-header {
      padding: 12px 20px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .json-card-header span {
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
    }
    .copy-btn {
      font-size: 11px;
      padding: 4px 10px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
    }
    .copy-btn:hover { background: #475569; }
    .json-body {
      padding: 16px 20px;
      font-size: 12px;
      color: #a3e635;
      font-family: 'Courier New', monospace;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 320px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1><span class="logo-dot"></span>בדיקת דומיין</h1>
    <p>בדוק זמינות דומיין ורישום עתידי דרך LiveDNS</p>
  </div>

  <!-- Search -->
  <div class="search-card">
    <span class="search-label">הכנס שם דומיין לבדיקה</span>
    <div class="search-row">
      <input
        id="domainInput"
        class="search-input"
        type="text"
        placeholder="example.co.il"
        onkeydown="if(event.key==='Enter') checkDomain()"
      />
      <button class="search-btn" id="searchBtn" onclick="checkDomain()">
        <span id="btnText">בדוק</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Result -->
  <div class="result-card" id="resultCard">

    <div class="result-header">
      <div class="domain-name" id="resDomain"></div>
      <div class="status-badge" id="resBadge">
        <div class="status-dot"></div>
        <span id="resBadgeText"></span>
      </div>
    </div>

    <div class="suggestions-section" id="suggestionsSection" style="display:none">
      <div class="section-title">סיומות זמינות</div>
      <div class="suggestions-grid" id="suggestionsGrid"></div>
    </div>

    <div class="whois-section" id="whoisSection" style="display:none">
      <div class="section-title">Whois Info</div>
      <div class="whois-text" id="whoisText"></div>
    </div>

    <div class="register-section">
      <button class="register-btn coming-soon" id="registerBtn" onclick="registerDomain()">
        🔒 רישום דומיין — בקרוב
      </button>
    </div>
  </div>

  <!-- JSON Preview for developers -->
  <div class="json-card" id="jsonCard">
    <div class="json-card-header">
      <span>📦 JSON Response (API)</span>
      <button class="copy-btn" onclick="copyJson()">העתק</button>
    </div>
    <div class="json-body" id="jsonBody"></div>
  </div>

  <script>
    let lastJson = null;
    let selectedDomain = null;

    async function checkDomain() {
      const input = document.getElementById('domainInput');
      const domain = input.value.trim().toLowerCase();

      if (!domain) return;

      setLoading(true);
      hideError();
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('jsonCard').style.display = 'none';

      try {
        const res = await fetch(`/api/domain/check?domain=${encodeURIComponent(domain)}`);
        const data = await res.json();

        if (!data.success) {
          showError(data.message || 'שגיאה בבדיקת הדומיין');
          return;
        }

        renderResult(data);
        renderJson(data);

      } catch (err) {
        showError('שגיאת רשת — נסה שוב');
      } finally {
        setLoading(false);
      }
    }

    function renderResult(data) {
      selectedDomain = data.domain;

      document.getElementById('resDomain').textContent = data.domain;

      // Badge
      const badge = document.getElementById('resBadge');
      const badgeText = document.getElementById('resBadgeText');
      badge.className = 'status-badge';

      if (data.available === true) {
        badge.classList.add('available');
        badgeText.textContent = 'פנוי לרישום ✓';
      } else if (data.available === false) {
        badge.classList.add('taken');
        badgeText.textContent = 'תפוס';
      } else {
        badge.classList.add('unknown');
        badgeText.textContent = 'לא ידוע';
      }

      // Suggestions
      const sugSection = document.getElementById('suggestionsSection');
      const grid = document.getElementById('suggestionsGrid');
      if (data.suggestions && data.suggestions.length > 0) {
        grid.innerHTML = '';
        data.suggestions.forEach(s => {
          const chip = document.createElement('div');
          chip.className = 'suggestion-chip';
          chip.innerHTML = `<span class="chip-icon">✓</span>${s.domain}`;
          chip.onclick = () => {
            document.getElementById('domainInput').value = s.domain;
            checkDomain();
          };
          grid.appendChild(chip);
        });
        sugSection.style.display = 'block';
      } else {
        sugSection.style.display = 'none';
      }

      // Whois
      const whoisSection = document.getElementById('whoisSection');
      if (data.whoisSummary) {
        document.getElementById('whoisText').textContent = data.whoisSummary;
        whoisSection.style.display = 'block';
      } else {
        whoisSection.style.display = 'none';
      }

      // Register button
      const btn = document.getElementById('registerBtn');
      if (data.available === true) {
        btn.className = 'register-btn coming-soon';
        btn.innerHTML = '🔒 רישום דומיין — בקרוב';
      } else {
        btn.className = 'register-btn coming-soon';
        btn.innerHTML = '🔒 דומיין תפוס — בקרוב חלופות';
      }

      document.getElementById('resultCard').style.display = 'block';
    }

    function renderJson(data) {
      lastJson = data;
      document.getElementById('jsonBody').textContent = JSON.stringify(data, null, 2);
      document.getElementById('jsonCard').style.display = 'block';
    }

    function registerDomain() {
      // placeholder — יופעל כשיהיו credentials
      alert('רישום דומיין יהיה זמין בקרוב!');
    }

    function copyJson() {
      if (!lastJson) return;
      navigator.clipboard.writeText(JSON.stringify(lastJson, null, 2))
        .then(() => {
          const btn = document.querySelector('.copy-btn');
          btn.textContent = '✓ הועתק';
          setTimeout(() => btn.textContent = 'העתק', 2000);
        });
    }

    function setLoading(on) {
      const btn = document.getElementById('searchBtn');
      const spinner = document.getElementById('spinner');
      const text = document.getElementById('btnText');
      btn.disabled = on;
      spinner.style.display = on ? 'block' : 'none';
      text.style.display = on ? 'none' : 'inline';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }
  </script>
</body>
</html>
