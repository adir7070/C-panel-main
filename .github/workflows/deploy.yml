name: Deploy cpanel to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HEROKU_APP_NAME = the name of YOUR Heroku app (set it as a repo secret
      # alongside HEROKU_API_KEY). Remember to also set the server's config
      # vars on Heroku: MONGO_URI, AUTH_SECRET, LEADS_INTAKE_KEY, API_TARGET,
      # OPENAI_API_KEY, GEMINI_API_KEY, FB_* — see .env.example.
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git
          git push heroku HEAD:main --force
